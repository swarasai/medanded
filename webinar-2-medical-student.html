<style>

.webinar2-hero{
  background:#682523;color:#fff;text-align:center;

}
.webinar2-hero h1{

.webinar2-hero p{margin:0;font-size:18px}
.webinar2-hero a{color:#fff;text-decoration:none}

.webinar2-wrap{

}

/* Same WordPress red title box treatment */

  background:#e32126;color:#fff;text-align:center;
  padding:50px 24px;font-size:40px;line-height:1.2;
  font-weight:400;margin:0 0 28px
}

/* Presentation link is text-style, centered */
.webinar2-actions{
  display:flex;flex-direction:column;align-items:center;
  gap:28px;margin:0 0 36px
}
.webinar2-btn{
  display:inline-block!important;min-width:0!important;

.webinar2-btn:nth-child(2){

}

.webinar-carousel-shell{
  position:relative;max-width:1220px;margin:18px auto 0;
  background:#fff;overflow:hidden
}
.webinar-carousel-track{
  display:flex;transition:transform .45s ease;will-change:transform
}
.webinar-carousel-slide{
  flex:0 0 100%;min-height:620px;display:flex;
  align-items:center;justify-content:center;background:#fff
}
.webinar-carousel-slide img{
  display:block;width:100%;height:620px;object-fit:contain;background:#fff
}
.webinar-carousel-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  z-index:3;width:42px;height:42px;border:0;border-radius:50%;
  background:rgba(227,33,38,.92);color:#fff;font-size:27px;cursor:pointer

.webinar-carousel-prev{left:16px}
.webinar-carousel-next{right:16px}
.webinar-carousel-dots{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:16px 8px 8px
}
.webinar-dot{
  width:9px;height:9px;border:0;border-radius:50%;
  padding:0;background:#c9c9c9;cursor:pointer
}
.webinar-dot.active{background:#e32126}
.webinar-carousel-count{text-align:center;color:#666;font-size:14px;margin-top:8px}

  <section class="webinar2-wrap">

    <div class="webinar2-actions">

         href="https://drive.google.com/file/d/1fJmfUvorugGzcmvtMfDRWjLX0pK-XyzO/view?usp=sharing"
         target="_blank"
         rel="noopener">——————– View Presentation ———————–</a>
      <a class="webinar2-btn webinar-linkbox webinar-video-linkbox"
         href="https://youtu.be/nS6oqPDPmU4"
         target="_blank"
         rel="noopener">Watch the webinar with Kelly Heyman</a>
    </div>

    <div class="webinar-carousel-shell" id="webinar2Carousel">
      <div class="webinar-carousel-track" id="webinar2CarouselTrack">
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-2-carousel/slide-01.png' | relative_url }}" alt="Webinar 2 presentation slide 1">
        </div>
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-2-carousel/slide-02.png' | relative_url }}" alt="Webinar 2 presentation slide 2">
        </div>
        <div class="webinar-carousel-slide">

        </div>
      </div>
      <button class="webinar-carousel-btn webinar-carousel-prev" id="webinar2Prev" type="button" aria-label="Previous slide">&#8249;</button>
      <button class="webinar-carousel-btn webinar-carousel-next" id="webinar2Next" type="button" aria-label="Next slide">&#8250;</button>

      <button class="webinar-dot" type="button" data-index="2" aria-label="Go to slide 3"></button>
    </div>
    <div class="webinar-carousel-count" id="webinar2Count">1 / 3</div>
  </section>
</main>

<script>
(function() {
  const track = document.getElementById('webinar2CarouselTrack');
  const prev = document.getElementById('webinar2Prev');
  const next = document.getElementById('webinar2Next');
  const dots = Array.from(document.querySelectorAll('.webinar-dot'));
  const count = document.getElementById('webinar2Count');
  if (!track || !prev || !next || !dots.length) return;

  let index = 0;
  const total = 3;

  function show(i) {
    index = (i + total) % total;
    track.style.transform = `translateX(${-index * 100}%)`;
    dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
    count.textContent = `${index + 1} / ${total}`;
  }

  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  dots.forEach((dot, n) => dot.addEventListener('click', () => show(n)));

  let startX = null;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
  track.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) show(index + (dx < 0 ? 1 : -1));
    startX = null;
  }, {passive:true});

  show(0);
})();
</script>
