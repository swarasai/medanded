<script>
(function() {
  const track = document.getElementById('webinar1CarouselTrack');
  const prev = document.getElementById('webinar1Prev');
  const next = document.getElementById('webinar1Next');
  const dots = Array.from(document.querySelectorAll('.webinar-dot'));
  const count = document.getElementById('webinar1Count');
  if (!track || !prev || !next || !dots.length) return;

  let index = 0;
  const total = 6;

  function show(i) {
    index = (i + total) % total;
    track.style.transform = `translateX(${-index * 100}%)`;
    dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
    count.textContent = `${index + 1} / ${total}`;
  }

  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  dots.forEach((dot, n) => dot.addEventListener('click', () => show(n)));

  let startX = null;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
  track.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) show(index + (dx < 0 ? 1 : -1));
    startX = null;
  }, {passive:true});

  show(0);
})();
</script>
