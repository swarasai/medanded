<div class="social-topbar">
  <div class="social-topbar-inner">
    <div class="social-links">
      <a class="social-round" href="https://www.facebook.com/medanded/" target="_blank" rel="noopener" aria-label="Facebook">
        <span class="fb-mark">f</span>
      </a>
      <a class="social-round" href="https://www.instagram.com/medanded_org/" target="_blank" rel="noopener" aria-label="Instagram">
        <span class="ig-mark">◎</span>
      </a>
      <a class="social-round" href="mailto:contactmedanded@gmail.com" aria-label="Email">
        <span class="mail-mark">✉</span>
      </a>
    </div>
  </div>
</div>

<header class="wp-header">
  <div class="wp-header-inner">
    <a class="wp-logo" href="index.html">
      <span class="wp-logo-main">Med n' Ed</span>
      <span class="wp-logo-sub">To medicate and educate all in<br>need</span>
    </a>


    <button class="mobile-menu-toggle" id="mobileMenuToggle"
            type="button" aria-label="Open menu"
            aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>

    <nav class="wp-nav" id="mainNav" aria-label="Main navigation">
      <a href="index.html"{% if page.nav_group == "home" %} class="active"{% endif %}>Home</a>
      <span class="nav-sep"></span>

      <div class="nav-dropdown{% if page.nav_group == 'about' %} current{% endif %}">
        <button class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
          About Us <span class="nav-chevron" aria-hidden="true"></span>
        </button>
        <div class="nav-dropdown-menu">
          <a href="mission.html"{% if page.page_id == "mission" %} class="active"{% endif %}>Our Mission</a>
          <a href="motivation.html"{% if page.page_id == "motivation" %} class="active"{% endif %}>Our Motivation</a>
          <a href="partner-sponsor.html"{% if page.page_id == "partner-sponsor" %} class="active"{% endif %}>Partner/Sponsor</a>
        </div>
      </div>

      <span class="nav-sep"></span>
      <a href="team.html"{% if page.nav_group == "team" %} class="active"{% endif %}>Our team</a>
      <span class="nav-sep"></span>

      <div class="nav-dropdown{% if page.nav_group == 'events' %} current{% endif %}">
        <button class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
          Events <span class="nav-chevron" aria-hidden="true"></span>
        </button>
        <div class="nav-dropdown-menu">
          <a href="interviews.html"{% if page.page_id == "interviews" %} class="active"{% endif %}>Interviews</a>
          <a href="instagram-takeovers.html"{% if page.page_id == "instagram-takeovers" %} class="active"{% endif %}>Instagram Takeovers</a>
          <a href="projects.html"{% if page.page_id == "projects" %} class="active"{% endif %}>Projects</a>
          <a href="resources.html"{% if page.page_id == "resources" %} class="active"{% endif %}>Resources</a>
          <a href="youtube-videos.html"{% if page.page_id == "youtube-videos" %} class="active"{% endif %}>Youtube Videos</a>
        </div>
      </div>

      <span class="nav-sep"></span>
      <a href="get-involved.html"{% if page.nav_group == "get-involved" %} class="active"{% endif %}>Get Involved</a>
      <span class="nav-sep"></span>
      <a href="contact.html"{% if page.nav_group == "contact" %} class="active"{% endif %}>Contact Us</a>
      <button class="wp-search-button" id="wpSearchButton" type="button"
        aria-label="Open search" aria-expanded="false">
        <span class="wp-search-glass" aria-hidden="true"></span>
      </button>

      <div class="wp-search-overlay" id="wpSearchOverlay" aria-hidden="true">
        <button class="wp-search-close" id="wpSearchClose" type="button" aria-label="Close search">×</button>
        <form class="wp-search-overlay-form" action="search.html" method="get" role="search">
          <label class="sr-only" for="wpSearchInput">Search Med n' Ed</label>
          <input id="wpSearchInput" name="q" type="search" placeholder="Search..." autocomplete="off">
          <button type="submit" aria-label="Submit search">
            <span class="wp-search-glass light" aria-hidden="true"></span>
          </button>
        </form>
      </div>
      <a class="wp-donate" href="https://www.paypal.com/paypalme/medanded?locale.x=en_US" target="_blank" rel="noopener">DONATE</a>
    </nav>
  </div>
</header>
