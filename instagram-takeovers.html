---
layout: default
title: Instagram Takeover
---

<style>
.ig-page {
  background: #fff;
  color: #222;
}

/* WordPress-style hero */
.ig-hero {
  background: #682523;
  color: #fff;
  text-align: center;
  padding: 94px 20px 92px;
}

.ig-hero h1 {
  margin: 0 0 10px;
  font-size: 42px;
  line-height: 1.15;
  font-weight: 700;
}

.ig-hero p {
  margin: 0;
  font-size: 18px;
}

.ig-hero a {
  color: #fff;
  text-decoration: none;
}

/* Grid */
.ig-wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding: 90px 24px 95px;
}

.ig-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 30px 30px;
  align-items: start;
}

/* WordPress card appearance */
.ig-card {
  position: relative;
  display: block;
  min-height: 0;
  overflow: hidden;
  background: #eee;
  text-decoration: none;
}

.ig-card img {
  width: 100%;
  display: block;
  aspect-ratio: 1 / 1.16;
  object-fit: cover;
  object-position: center;
  opacity: .53;
  transition: opacity .2s ease;
}

.ig-card:hover img {
  opacity: .61;
}

.ig-card-title {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
  color: #ed1c24;
  font-size: 31px;
  line-height: 1.28;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 4px;
  z-index: 2;
}

.ig-card-title.two-line {
  max-width: 100%;
}

/* The 4th card sits alone in column 1, exactly like the original */
.ig-card-four {
  grid-column: 1;
}

/* Match the WordPress crop of each image */
.ig-card.premed1 img {
  object-position: center 32%;
}

.ig-card.medstudent img {
  object-position: center 35%;
}

.ig-card.premed2 img {
  object-position: center 38%;
}

.ig-card.premed3 img {
  object-position: center 28%;
}

@media (max-width: 900px) {
  .ig-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ig-card-four {
    grid-column: auto;
  }

  .ig-card-title {
    font-size: 28px;
  }
}

@media (max-width: 620px) {
  .ig-hero {
    padding: 70px 18px 68px;
  }

  .ig-hero h1 {
    font-size: 34px;
  }

  .ig-wrap {
    padding: 55px 18px 70px;
  }

  .ig-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .ig-card img {
    aspect-ratio: 1 / 1.12;
  }

  .ig-card-title {
    font-size: 27px;
  }
}
</style>

<main class="ig-page">

  <section class="ig-hero">
    <h1>Instagram Takeover</h1>
    <p><a href="{{ '/' | relative_url }}">Home</a> &nbsp;&gt;&nbsp; Instagram Takeover</p>
  </section>

  <section class="ig-wrap">
    <div class="ig-grid">

      <a class="ig-card premed1" href="{{ '/premed-takeover.html' | relative_url }}">
        <img src="{{ '/images/instagram-takeovers/premed-takeover-cover.png' | relative_url }}" alt="Premed Takeover">
        <span class="ig-card-title">Premed Takeover</span>
      </a>

      <a class="ig-card medstudent" href="{{ '/med-student-takeover.html' | relative_url }}">
        <img src="{{ '/images/instagram-takeovers/med-student-takeover-cover.jpg' | relative_url }}" alt="Med Student Takeover">
        <span class="ig-card-title two-line">Med Student<br>Takeover</span>
      </a>

      <a class="ig-card premed2" href="{{ '/premed-takeover-2.html' | relative_url }}">
        <img src="{{ '/images/instagram-takeovers/premed-takeover-2-cover.png' | relative_url }}" alt="Premed Takeover #2">
        <span class="ig-card-title two-line">Premed Takeover<br>#2</span>
      </a>

      <a class="ig-card premed3 ig-card-four" href="{{ '/premed-takeover-3.html' | relative_url }}">
        <img src="{{ '/images/instagram-takeovers/premed-takeover-3-cover.png' | relative_url }}" alt="Premed Takeover #3">
        <span class="ig-card-title two-line">Premed Takeover<br>#3</span>
      </a>

    </div>
  </section>

</main>
