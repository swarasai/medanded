<style>
/* Intentionally very specific selectors so shared site CSS cannot override this page */
#instagram-takeover-page {
  background:#fff;

}

#instagram-takeover-page .ig-wp-hero {

}

#instagram-takeover-page .ig-wp-hero h1 {

}

#instagram-takeover-page .ig-wp-grid {

}

#instagram-takeover-page a.ig-wp-card {

  background:#fff !important;
  text-decoration:none !important;
  box-shadow:none !important;
  border:0 !important;
}

#instagram-takeover-page a.ig-wp-card img {

  width:100% !important;

#instagram-takeover-page a.ig-wp-card .ig-wp-label {

  left:18px !important;

  padding:0 !important;
  margin:0 !important;
  background:transparent !important;
  background-color:transparent !important;
  border:0 !important;

  text-decoration-thickness:2px !important;
  text-underline-offset:4px !important;
  white-space:normal !important;
  z-index:5 !important;
}

#instagram-takeover-page .ig-wp-card.premed1 img { object-position:center 32% !important; }
#instagram-takeover-page .ig-wp-card.medstudent img { object-position:center 35% !important; }

@media (max-width:620px) {
