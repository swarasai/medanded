<style>
.webinar3-page {
  background:#fff;
}

.webinar3-hero {
  background:#682523;
  color:#fff;
  text-align:center;
  padding:96px 20px 92px;
}

.webinar3-hero h1 {
  margin:0 0 10px;
  font-size:42px;
  line-height:1.15;
  font-weight:700;
}

.webinar3-hero p {
  margin:0;
  font-size:18px;
}

.webinar3-hero a {
  color:#fff;
  text-decoration:none;
}

.webinar3-wrap {
  max-width:1320px;
  margin:112px auto 95px;
  padding:0 24px;
}

.webinar3-title {
  color:#e32126;
  text-align:center;
  font-size:40px;
  line-height:1.2;
  font-weight:400;
  margin:0 0 28px;
}

.webinar3-actions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  margin:0 0 20px;
}

.webinar3-btn {
  display:inline-block;
  min-width:280px;
  padding:11px 24px;
  border:2px solid #e32126;
  border-radius:9px;
  background:#fff;
  color:#e32126 !important;
  text-decoration:none !important;
  text-align:center;
  font-size:16px;
}

.webinar-carousel-shell {
  position:relative;
  max-width:1220px;
  margin:18px auto 0;
  background:#111;
  overflow:hidden;
}

.webinar-carousel-track {
  display:flex;
  transition:transform .45s ease;
  will-change:transform;
}

.webinar-carousel-slide {
  flex:0 0 100%;
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
}

.webinar-carousel-slide img {
  display:block;
  width:100%;
  height:620px;
  object-fit:contain;
  background:#111;
}

.webinar-carousel-btn {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:3;
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(227,33,38,.92);
  color:#fff;
  font-size:28px;
  cursor:pointer;
}

.webinar-carousel-prev { left:16px; }
.webinar-carousel-next { right:16px; }

.webinar-carousel-dots {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  padding:16px 8px 8px;
}

.webinar-dot {
  width:9px;
  height:9px;
  border:0;
  border-radius:50%;
  padding:0;
  background:#c9c9c9;
  cursor:pointer;
}

.webinar-dot.active {
  background:#e32126;
}

.webinar-carousel-count {
  text-align:center;
  color:#666;
  font-size:14px;
  margin-top:8px;
}

@media(max-width:900px) {
  .webinar3-hero h1 { font-size:34px; }
  .webinar3-title { font-size:32px; }
  .webinar-carousel-slide { min-height:460px; }
  .webinar-carousel-slide img { height:460px; }
}

@media(max-width:600px) {
  .webinar3-hero {
    padding:74px 18px;
  }

  .webinar3-wrap {
    margin-top:58px;
    padding:0 14px;
  }

  .webinar3-title {
    font-size:28px;
  }

  .webinar3-actions {
    flex-direction:column;
  }

  .webinar3-btn {
    min-width:0;
    width:100%;
  }

  .webinar-carousel-slide {
    min-height:300px;
  }

  .webinar-carousel-slide img {
    height:300px;
  }

  .webinar-carousel-btn {
    width:38px;
    height:38px;
    font-size:23px;
  }
}
</style>

<main class="webinar3-page">
  <section class="webinar3-hero">
    <h1>Webinar #3- Residency</h1>
    <p><a href="{{ '/' | relative_url }}">Home</a> &nbsp;&gt;&nbsp; Webinar #3- Residency</p>
  </section>

  <section class="webinar3-wrap">
    <div class="webinar3-title">Webinar #3 – Residency Student</div>

    <div class="webinar3-actions">
      <a class="webinar3-btn"
         href="https://youtu.be/eVzgtf3qeeY"
         target="_blank"
         rel="noopener">
        ---- Presentation Link ----
      </a>
      <a class="webinar3-btn"
         href="https://youtu.be/eVzgtf3qeeY"
         target="_blank"
         rel="noopener">
        Watch the Webinar with Dr. Teresa Nguyen
      </a>
    </div>

    <div class="webinar-carousel-shell" id="webinar3Carousel">
      <div class="webinar-carousel-track" id="webinar3CarouselTrack">
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-3-carousel/slide-01.png' | relative_url }}" alt="Webinar 3 presentation slide 1">
        </div>
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-3-carousel/slide-02.png' | relative_url }}" alt="Webinar 3 presentation slide 2">
        </div>
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-3-carousel/slide-03.png' | relative_url }}" alt="Webinar 3 presentation slide 3">
        </div>
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-3-carousel/slide-04.png' | relative_url }}" alt="Webinar 3 presentation slide 4">
        </div>
        <div class="webinar-carousel-slide">
          <img src="{{ '/images/projects/webinars/webinar-3-carousel/slide-05.png' | relative_url }}" alt="Webinar 3 presentation slide 5">
        </div>
      </div>
      <button class="webinar-carousel-btn webinar-carousel-prev" id="webinar3Prev" type="button" aria-label="Previous slide">&#8249;</button>
      <button class="webinar-carousel-btn webinar-carousel-next" id="webinar3Next" type="button" aria-label="Next slide">&#8250;</button>
    </div>

    <div class="webinar-carousel-dots" id="webinar3Dots">
      <button class="webinar-dot active" type="button" data-index="0" aria-label="Go to slide 1"></button>
      <button class="webinar-dot" type="button" data-index="1" aria-label="Go to slide 2"></button>
      <button class="webinar-dot" type="button" data-index="2" aria-label="Go to slide 3"></button>
      <button class="webinar-dot" type="button" data-index="3" aria-label="Go to slide 4"></button>
      <button class="webinar-dot" type="button" data-index="4" aria-label="Go to slide 5"></button>
    </div>
    <div class="webinar-carousel-count" id="webinar3Count">1 / 5</div>
  </section>
</main>

<script>
(function() {
  const track = document.getElementById('webinar3CarouselTrack');
  const prev = document.getElementById('webinar3Prev');
  const next = document.getElementById('webinar3Next');
  const dots = Array.from(document.querySelectorAll('.webinar-dot'));
  const count = document.getElementById('webinar3Count');
  if (!track || !prev || !next || !dots.length) return;

  let index = 0;
  const total = 5;

  function show(i) {
    index = (i + total) % total;
    track.style.transform = `translateX(${-index * 100}%)`;
    dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
    count.textContent = `${index + 1} / ${total}`;
  }

  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  dots.forEach((dot, n) => dot.addEventListener('click', () => show(n)));

  let startX = null;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
  track.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) show(index + (dx < 0 ? 1 : -1));
    startX = null;
  }, {passive:true});

  show(0);
})();
</script>
