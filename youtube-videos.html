layout: default
title: Youtube Videos

<style>
.youtube-page {
  background:#fff;
}

.youtube-hero {
  background:#682523;
  color:#fff;
  text-align:center;
  padding:100px 20px 96px;
}

.youtube-hero .wrap {
  max-width:1120px;
  margin:0 auto;
}

.youtube-hero h1 {
  margin:0 0 10px;
  font-size:42px;
  line-height:1.15;
  font-weight:700;
}

.youtube-hero p {
  margin:0;
  font-size:18px;
}

.youtube-hero a {
  color:#fff;
  text-decoration:none;
}

.youtube-content {
  max-width:1320px;
  margin:118px auto 135px;
  padding:0 24px;
}

.youtube-grid {
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:58px 34px;
  align-items:start;
}

.yt-card {
  min-width:0;
}

.yt-frame-wrap {
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  background:#000;
  overflow:hidden;
}

.yt-frame-wrap iframe {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

@media (max-width:900px) {
  .youtube-grid {
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
  .youtube-content {
    margin-top:75px;
  }
}

@media (max-width:600px) {
  .youtube-hero {
    padding:78px 18px 74px;
  }
  .youtube-hero h1 {
    font-size:34px;
  }
  .youtube-hero p {
    font-size:16px;
  }
  .youtube-content {
    margin:50px auto 80px;
    padding:0 16px;
  }
  .youtube-grid {
    grid-template-columns:1fr;
    gap:30px;
  }
}
</style>
